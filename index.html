<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belge</title>
<style>
  :root { --bar: #b3001b; --bg: #e9ebee; --fg: #fff; --acc: #7a0012; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--bar); color: var(--fg); box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  header h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .info { font-size: 13px; opacity: .75; white-space: nowrap; }
  header button, header a {
    border: 0; border-radius: 6px; padding: 7px 11px; font: inherit; font-size: 14px; cursor: pointer;
    background: rgba(255,255,255,.12); color: var(--fg); text-decoration: none; line-height: 1;
  }
  header button:hover, header a:hover { background: rgba(255,255,255,.22); }
  header a.dl { background: var(--acc); }
  #pages { display: flex; flex-direction: column; align-items: safe center; gap: 14px; padding: 18px 10px 40px; overflow-x: auto; }
  .page { position: relative; flex: none; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
  .page canvas { display: block; width: 100%; height: 100%; }
  #msg { text-align: center; color: #555; padding: 60px 20px; font-size: 15px; }
  @media (max-width: 560px) { header .info { display: none; } header h1 { font-size: 15px; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Belge</h1>
  <span class="info" id="info"></span>
  <button id="zoomOut" title="Uzaklaştır">−</button>
  <button id="zoomIn" title="Yakınlaştır">+</button>
  <a class="dl" id="dl" href="#" download>İndir</a>
</header>
<div id="msg">Yükleniyor…</div>
<div id="pages"></div>

<script type="module">
import * as pdfjsLib from "./pdfjs/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "./pdfjs/pdf.worker.min.mjs";

const $ = (id) => document.getElementById(id);
let cfg = { title: "Belge", file: "belge.pdf" };
try {
  const r = await fetch("config.json", { cache: "no-store" });
  if (r.ok) cfg = { ...cfg, ...(await r.json()) };
} catch {}

document.title = cfg.title;
$("title").textContent = cfg.title;
const fileUrl = cfg.file + "?v=" + (cfg.version || "");
$("dl").href = fileUrl;
$("dl").setAttribute("download", cfg.file);

let pdf, zoom = 1;
const pagesEl = $("pages");

try {
  pdf = await pdfjsLib.getDocument(fileUrl).promise;
} catch (e) {
  $("msg").textContent = "PDF açılamadı: " + e.message;
  throw e;
}
$("msg").remove();
$("info").textContent = pdf.numPages + " sayfa";

const holders = [];
const observer = new IntersectionObserver((entries) => {
  for (const en of entries) if (en.isIntersecting) renderPage(en.target);
}, { rootMargin: "800px 0px" });

async function build() {
  const first = await pdf.getPage(1);
  const base = first.getViewport({ scale: 1 });
  for (let i = 1; i <= pdf.numPages; i++) {
    const d = document.createElement("div");
    d.className = "page";
    d.dataset.n = i;
    d.style.aspectRatio = base.width + " / " + base.height;
    pagesEl.appendChild(d);
    holders.push(d);
    observer.observe(d);
  }
  layout();
}

function targetWidth() {
  return Math.min(pagesEl.clientWidth - 20, 1000) * zoom;
}

function layout() {
  const w = targetWidth();
  for (const d of holders) {
    d.style.width = w + "px";
    if (d.dataset.w && Math.abs(d.dataset.w - w) > 1) { d.dataset.w = ""; d.innerHTML = ""; }
  }
  for (const d of holders) {
    const r = d.getBoundingClientRect();
    if (r.bottom > -800 && r.top < innerHeight + 800) renderPage(d);
  }
}

async function renderPage(d) {
  const w = targetWidth();
  if (d.dataset.w == w || d.dataset.busy) return;
  d.dataset.busy = "1";
  try {
    const page = await pdf.getPage(+d.dataset.n);
    const v1 = page.getViewport({ scale: 1 });
    d.style.aspectRatio = v1.width + " / " + v1.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const vp = page.getViewport({ scale: (w / v1.width) * dpr });
    const c = document.createElement("canvas");
    c.width = Math.floor(vp.width);
    c.height = Math.floor(vp.height);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    d.innerHTML = "";
    d.appendChild(c);
    d.dataset.w = w;
  } finally {
    delete d.dataset.busy;
  }
}

let t;
addEventListener("resize", () => { clearTimeout(t); t = setTimeout(layout, 200); });
$("zoomIn").onclick = () => { zoom = Math.min(zoom * 1.25, 4); layout(); };
$("zoomOut").onclick = () => { zoom = Math.max(zoom / 1.25, 0.4); layout(); };

build();
</script>
</body>
</html>
